name: Ephemeral Daily Run (DigitalOcean)

on:
  schedule:
    - cron: "0 18 * * 1-5"
  workflow_dispatch: {}

jobs:
  run_ephemeral:
    environment: Production
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DO_API: https://api.digitalocean.com/v2

      # Droplet settings (non-secret; best as repo Variables if you prefer)
      DO_REGION: nyc3
      DO_SIZE: s-1vcpu-1gb
      DO_IMAGE: ubuntu-22-04-x64
      DO_VPC_UUID: ${{ vars.DO_VPC_UUID }}

      # Tag to help find/clean droplets
      DO_TAG: ephemeral-daily-run
      DO_APP_TAG: app-runners

      # The container image you want to run
      # Change this to your actual package name in GHCR
      JOB_IMAGE: ghcr.io/mosesmc52/gas-balance-risk:latest

      # Runtime settings
      TZ: ${{ vars.TZ }}

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create droplet (cloud-init runs the job)
        id: create
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          DO_SSH_KEY_FINGERPRINT: ${{ secrets.DO_SSH_KEY_FINGERPRINT }}

          # Only required if your GHCR image is private
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

          # Your job secrets/vars
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}

          AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          TO_ADDRESSES: ${{ secrets.TO_ADDRESSES }}
          FROM_ADDRESS: ${{ secrets.FROM_ADDRESS }}

          MONGO_HOST_PRIVATE: ${{ vars.MONGO_HOST_PRIVATE }}
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASS: ${{ secrets.MONGO_PASS }}

          MONGO_DB: ${{ vars.MONGO_DB }}
          SPLASH_URL: ${{ vars.SPLASH_URL }}
          SPACES_BUCKET: ${{ vars.SPACES_BUCKET }}
          SPACES_ENDPOINT: ${{ vars.SPACES_ENDPOINT }}
          SPACES_REGION: ${{ vars.SPACES_REGION }}
          AWS_SES_REGION_NAME: ${{ vars.AWS_SES_REGION_NAME }}

        run: |
          set -euo pipefail

          NAME="job-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          USER_DATA=$(cat <<CLOUD
          #cloud-config
          package_update: true
          packages:
            - ca-certificates
            - curl

          write_files:
            - path: /opt/job/ghcr.env
              permissions: "0600"
              content: |
                GHCR_USERNAME=${GHCR_USERNAME}
                GHCR_TOKEN=${GHCR_TOKEN}

            - path: /opt/job/env
              permissions: "0600"
              content: |
                TZ=${TZ}
                EIA_API_KEY=${EIA_API_KEY}
                MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@${MONGO_HOST_PRIVATE}:27017/${MONGO_DB}?authSource=admin
                MONGO_DB=${MONGO_DB}
                SPLASH_URL=${SPLASH_URL}
                SPACES_KEY=${SPACES_KEY}
                SPACES_SECRET=${SPACES_SECRET}
                SPACES_BUCKET=${SPACES_BUCKET}
                SPACES_REGION=${SPACES_REGION}
                SPACES_ENDPOINT=${SPACES_ENDPOINT}
                TO_ADDRESSES=${TO_ADDRESSES}
                FROM_ADDRESS=${FROM_ADDRESS}
                AWS_SES_REGION_NAME=${AWS_SES_REGION_NAME}
                AWS_SES_ACCESS_KEY_ID=${AWS_SES_ACCESS_KEY_ID}
                AWS_SES_SECRET_ACCESS_KEY=${AWS_SES_SECRET_ACCESS_KEY}

            - path: /opt/job/run.sh
              permissions: "0700"
              content: |
                #!/usr/bin/env bash
                set -euo pipefail

                LOG=/var/log/job.log
                echo "=== Job start: \$(date -Is) ===" | tee -a "\$LOG"

                echo "---- /opt/job/env (redacted) ----" | tee -a "\$LOG"
                sed -E 's/(KEY|TOKEN|SECRET|PASSWORD)=.*/\\1=REDACTED/g' /opt/job/env | tee -a "\$LOG"

                # Install Docker
                curl -fsSL https://get.docker.com | sh >>"\$LOG" 2>&1
                systemctl enable --now docker >>"\$LOG" 2>&1

                # Load GHCR creds if present
                if [ -f /opt/job/ghcr.env ]; then
                  set -a
                  . /opt/job/ghcr.env
                  set +a
                fi

                # Login to GHCR if creds are provided (needed for private images)
                if [ -n "\${GHCR_USERNAME:-}" ] && [ -n "\${GHCR_TOKEN:-}" ]; then
                  echo "\${GHCR_TOKEN}" | docker login ghcr.io -u "\${GHCR_USERNAME}" --password-stdin >>"\$LOG" 2>&1
                else
                  echo "GHCR creds not provided; assuming image is public." | tee -a "\$LOG"
                fi

                # -----------------------
                # Start Splash sidecar
                # -----------------------
                SPLASH_IMAGE="scrapinghub/splash:3.5"
                NET="jobnet"

                docker network inspect "\${NET}" >/dev/null 2>&1 || docker network create "\${NET}" >>"\$LOG" 2>&1

                echo "Pulling Splash image: \${SPLASH_IMAGE}" | tee -a "\$LOG"
                docker pull "\${SPLASH_IMAGE}" >>"\$LOG" 2>&1

                docker rm -f splash >/dev/null 2>&1 || true

                echo "Starting Splash..." | tee -a "\$LOG"
                docker run -d --name splash --network "\${NET}" "\${SPLASH_IMAGE}" >>"\$LOG" 2>&1

                echo "Waiting for Splash readiness..." | tee -a "\$LOG"
                for i in {1..60}; do
                  if docker run --rm --network "\${NET}" curlimages/curl:8.5.0 \
                       -fsS "http://splash:8050/_ping" >/dev/null 2>&1; then
                    echo "Splash is ready." | tee -a "\$LOG"
                    break
                  fi
                  sleep 2
                done

                if ! docker run --rm --network "\${NET}" curlimages/curl:8.5.0 \
                       -fsS "http://splash:8050/_ping" >/dev/null 2>&1; then
                  echo "Splash did not become ready in time." | tee -a "\$LOG"
                  docker logs splash | tail -n 200 | tee -a "\$LOG" || true
                  echo "1" > /opt/job/exit_code
                  poweroff || true
                  exit 1
                fi

                # -----------------------
                # Pull and run job image
                # -----------------------
                echo "Pulling job image: ${JOB_IMAGE}" | tee -a "\$LOG"
                docker pull "${JOB_IMAGE}" >>"\$LOG" 2>&1

                set +e
                docker run --rm --network "\${NET}" \
                  --env-file /opt/job/env \
                  -e SPLASH_URL="http://splash:8050" \
                  "${JOB_IMAGE}" /app/run.sh 2>&1 | tee -a "\$LOG"
                EXIT_CODE=\${PIPESTATUS[0]}
                set -e

                docker rm -f splash >>"\$LOG" 2>&1 || true

                echo "\${EXIT_CODE}" > /opt/job/exit_code
                echo "=== Job end: \$(date -Is) exit=\${EXIT_CODE} ===" | tee -a "\$LOG"

                poweroff || true

          runcmd:
            - [ bash, -lc, "/opt/job/run.sh" ]
          CLOUD
          )

          echo "Cloud-init length: ${#USER_DATA}"

          # Create droplet body. Optionally include VPC UUID if set.
          if [ -n "${DO_VPC_UUID}" ]; then
            BODY=$(jq -n \
              --arg name "$NAME" \
              --arg region "${DO_REGION}" \
              --arg size "${DO_SIZE}" \
              --arg image "${DO_IMAGE}" \
              --arg tag "${DO_TAG}" \
              --arg app_tag "${DO_APP_TAG}" \
              --arg sshfp "${DO_SSH_KEY_FINGERPRINT}" \
              --arg user_data "$USER_DATA" \
              --arg vpc_uuid "${DO_VPC_UUID}" \
              '{
                name: $name,
                region: $region,
                size: $size,
                image: $image,
                tags: [$tag, $app_tag],
                ssh_keys: [$sshfp],
                user_data: $user_data,
                monitoring: true,
                vpc_uuid: $vpc_uuid
              }')
          else
            BODY=$(jq -n \
              --arg name "$NAME" \
              --arg region "${DO_REGION}" \
              --arg size "${DO_SIZE}" \
              --arg image "${DO_IMAGE}" \
              --arg tag "${DO_TAG}" \
              --arg app_tag "${DO_APP_TAG}" \
              --arg sshfp "${DO_SSH_KEY_FINGERPRINT}" \
              --arg user_data "$USER_DATA" \
              '{
                name: $name,
                region: $region,
                size: $size,
                image: $image,
                tags: [$tag, $app_tag],
                ssh_keys: [$sshfp],
                user_data: $user_data,
                monitoring: true
              }')
          fi

          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer ${DO_TOKEN}" \
            -H "Content-Type: application/json" \
            "${DO_API}/droplets" \
            -d "${BODY}")

          echo "$RESP" | jq .

          DROPLET_ID=$(echo "$RESP" | jq -r '.droplet.id')
          if [ -z "$DROPLET_ID" ] || [ "$DROPLET_ID" = "null" ]; then
            echo "Failed to create droplet."
            exit 1
          fi

          echo "droplet_id=$DROPLET_ID" >> "$GITHUB_OUTPUT"
          echo "droplet_name=$NAME" >> "$GITHUB_OUTPUT"


      - name: Verify droplet has expected SSH key
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          DO_SSH_KEY_FINGERPRINT: ${{ secrets.DO_SSH_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          ID="${{ steps.create.outputs.droplet_id }}"

          D="$(curl -sS -H "Authorization: Bearer ${DO_TOKEN}" "${DO_API}/droplets/${ID}")"
          echo "$D" | jq -r '.droplet.ssh_keys'

          if echo "$D" | jq -e --arg fp "${DO_SSH_KEY_FINGERPRINT}" '.droplet.ssh_keys[]? | select(.fingerprint==$fp)' >/dev/null; then
            echo "OK: Droplet has expected SSH key fingerprint."
          else
            echo "ERROR: Droplet does NOT include expected SSH key fingerprint: ${DO_SSH_KEY_FINGERPRINT}"
            echo "This means ssh_keys attachment failed or fingerprint is wrong."
            exit 1
          fi


      - name: Wait for droplet active + get public IP
        id: ip
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          ID="${{ steps.create.outputs.droplet_id }}"

          for i in {1..120}; do
            D="$(curl -sS -H "Authorization: Bearer ${DO_TOKEN}" "${DO_API}/droplets/${ID}")"

            STATUS="$(echo "$D" | jq -r '.droplet.status // empty')"

            # Prefer public IPv4 if present
            IP_PUBLIC="$(echo "$D" | jq -r '.droplet.networks.v4[]? | select(.type=="public") | .ip_address' | head -n1)"
            IP_PRIVATE="$(echo "$D" | jq -r '.droplet.networks.v4[]? | select(.type=="private") | .ip_address' | head -n1)"

            echo "poll=${i} status=${STATUS:-?} public_ip=${IP_PUBLIC:-} private_ip=${IP_PRIVATE:-}"

            if [ "${STATUS}" = "active" ] && [ -n "${IP_PUBLIC}" ]; then
              echo "ip=${IP_PUBLIC}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for droplet public IPv4."
          echo "Last droplet payload:"
          echo "$D" | jq .
          exit 1


      - name: Wait for job completion and show logs
        env:
          IP: ${{ steps.ip.outputs.ip }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
            set -euo pipefail
            LOG=""
            # Runner-side log file (prevents 'LOG: unbound variable' if you add tee later)
            LOG="/home/runner/job-wait.log"
            touch "$LOG"

            # --- Write SSH key ---
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519

            # Validate key format (fails fast if malformed)
            ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

            SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=5 -i ~/.ssh/id_ed25519"

            # --- Determine SSH user (Ubuntu images often use 'ubuntu'; sometimes 'root') ---
            SSH_USER=""
            for u in ubuntu root; do
              if ssh ${SSH_OPTS} "${u}@${IP}" 'echo ok' >/dev/null 2>&1; then
                SSH_USER="$u"
                break
              fi
            done

            if [ -z "${SSH_USER}" ]; then
              echo "SSH login failed for ubuntu and root." | tee -a "$LOG"
              exit 1
            fi

            echo "Using SSH user: ${SSH_USER}" | tee -a "$LOG"

            # --- Wait for the job to finish, while streaming logs ---
            MAX_LOOPS=120
            SLEEP_SECS=15
            TAIL_LINES=30

            echo "Waiting for /opt/job/exit_code (tailing /var/log/job.log every ${SLEEP_SECS}s)..." | tee -a "$LOG"

            for i in $(seq 1 ${MAX_LOOPS}); do
              if ssh ${SSH_OPTS} "${SSH_USER}@${IP}" 'test -f /opt/job/exit_code'; then
                echo "Job finished signal found: /opt/job/exit_code" | tee -a "$LOG"
                break
              fi

              echo "----- Loop ${i}/${MAX_LOOPS}: job still running. Log tail: -----" | tee -a "$LOG"
              ssh ${SSH_OPTS} "${SSH_USER}@${IP}" "tail -n ${TAIL_LINES} /var/log/job.log 2>/dev/null || echo '(job.log not created yet)'" || true

              sleep ${SLEEP_SECS}
            done

            if ! ssh ${SSH_OPTS} "${SSH_USER}@${IP}" 'test -f /opt/job/exit_code'; then
              echo "Timed out waiting for /opt/job/exit_code." | tee -a "$LOG"
              ssh ${SSH_OPTS} "${SSH_USER}@${IP}" "tail -n 800 /var/log/job.log || true" || true
              exit 1
            fi

            echo "----- job.log (tail 200) -----"
            ssh ${SSH_OPTS} "${SSH_USER}@${IP}" 'tail -n 800 /var/log/job.log || true' || true

            EXIT=$(ssh ${SSH_OPTS} "${SSH_USER}@${IP}" 'cat /opt/job/exit_code || echo 999' || echo 999)
            echo "Job exit code: ${EXIT}" | tee -a "$LOG"

            if [ "${EXIT}" != "0" ]; then
              exit 1
            fi

      - name: Destroy droplet (always)
        if: always()
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          ID="${{ steps.create.outputs.droplet_id }}"
          echo "Destroying droplet ${ID}..."
          curl -sS -X DELETE \
            -H "Authorization: Bearer ${DO_TOKEN}" \
            "${DO_API}/droplets/${ID}" | cat
